name: Weekly Prompt Review

# Reads the picks the verification pass rejected over the past week and, if there is a
# recurring prompt-level defect, opens a PR proposing an edit to _AI_SYSTEM_PROMPT.
# Never touches main — the PR is for a human to review and merge.

on:
  schedule:
    - cron: '0 13 * * 1'   # Monday 9:00 AM ET (UTC-4)
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days of rejections to review'
        required: false
        default: '7'

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Review rejections and propose a prompt edit
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python3 scripts/review_rejections.py \
            --days "${{ github.event.inputs.days || 7 }}" \
            --out prompt_proposal.json \
            --write
          echo "code=$?" >> $GITHUB_OUTPUT
          set -e

      # Exit 2 means "nothing to review" or "no change recommended" — both are normal
      # outcomes and should end the run quietly rather than failing it.
      - name: Nothing to propose
        if: steps.review.outputs.code == '2'
        run: echo "No prompt change recommended this week."

      - name: Fail on error
        if: steps.review.outputs.code != '0' && steps.review.outputs.code != '2'
        run: |
          echo "::error::review_rejections.py failed (exit ${{ steps.review.outputs.code }})"
          exit 1

      - name: Open pull request
        if: steps.review.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u +%Y-%m-%d)
          BRANCH="prompt-review/$WEEK"

          python3 - <<'PY' > pr_body.md
          import json
          p = json.load(open("prompt_proposal.json"))
          print("## Weekly prompt review\n")
          print(p.get("summary", ""))
          pats = p.get("patterns") or []
          if pats:
              print("\n### Patterns found\n")
              for x in pats:
                  print(f"**{x.get('pattern')}** — {x.get('count')} occurrence(s)\n")
                  if x.get("example"):
                      print(f"> {x['example']}\n")
                  print(f"*Prompt gap:* {x.get('prompt_gap')}\n")
          print("\n### Proposed change\n")
          print(p.get("change_summary") or "(see diff)")
          print(f"\n{p.get('rationale', '')}\n")
          print("---\n")
          print("Auto-generated from `rejections/`. **Review the diff before merging** — "
                "this edits the prompt that drives every pick.\n")
          print("Nothing was changed on `main`.")
          PY

          TITLE=$(python3 -c "import json;p=json.load(open('prompt_proposal.json'));print('Prompt review: '+(p.get('change_summary') or 'proposed update'))")

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add suggestions.py
          git commit -m "$TITLE" -m "Auto-proposed from the past week of verification rejections."
          git push -u origin "$BRANCH" --force

          gh pr create --title "$TITLE" --body-file pr_body.md \
            --base main --head "$BRANCH" 2>/dev/null \
            || gh pr edit "$BRANCH" --title "$TITLE" --body-file pr_body.md

          gh pr view "$BRANCH" --json url -q .url
