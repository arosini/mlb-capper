name: Update MLB Dashboard

on:
  schedule:
    - cron: '30 7 * * *'   # 3:30 AM ET (UTC-4)
    - cron: '0 14 * * *'   # 10 AM ET
    - cron: '0 20 * * *'   # 4 PM ET
    - cron: '30 22 * * *'  # 6:30 PM ET — tomorrow's Handigraphs slate is usually posted by now
    # Catch-up. GitHub's scheduler is best-effort and has been badly degraded for this
    # repo: across 2026-08-27..29 not one delivery landed near its slot (03:28, 18:21,
    # 23:17 / 03:58, 06:14, 19:30, 23:14 / 02:38, 03:48 UTC), and the ET morning was
    # missed outright twice, leaving yesterday's slate on the site both mornings.
    # Four chances a day is too few when each one can silently not happen. This fires
    # hourly and the `decide` job below turns almost all of them into a no-op — it only
    # lets a run through when today's ET slate has not been published at all.
    - cron: '0 * * * *'
  workflow_dispatch:        # manual trigger
  push:
    branches: [main]        # redeploy on every push to main

permissions:
  contents: write

# Never two publishes at once. A catch-up run can now coincide with a late scheduled
# delivery, and concurrent runs race on the commit of history/ and picks/ — the retry
# path handles that, but not racing is cheaper than recovering from it. Queue, never
# cancel: a superseded publish is still a publish that needed to happen.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Cheap gate, so the hourly catch-up costs a few seconds rather than a full run plus
  # an Anthropic bill. Everything except the hourly cron passes straight through.
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: gate
        run: |
          set -euo pipefail
          # season.today_et() is the one Eastern clock this project shares; deriving the
          # date any other way here would disagree with the code by an hour under EST.
          read -r DATE HOUR < <(python3 -c "import season,datetime; n=datetime.datetime.now(season.ET); print(n.strftime('%Y-%m-%d'), n.hour)")
          EVENT='${{ github.event_name }}'
          CRON='${{ github.event.schedule }}'
          if [ "$EVENT" != "schedule" ] || [ "$CRON" != "0 * * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT/$CRON is a first-class trigger — running."
            exit 0
          fi
          # Hourly catch-up. history/{date}.json is written by the first run of each ET
          # day, so its absence means today has not been published at all.
          if [ -f "history/${DATE}.json" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "history/${DATE}.json exists — today is published, skipping."
            exit 0
          fi
          if [ "$HOUR" -lt 3 ] || [ "$HOUR" -gt 21 ]; then
            # Before the 3:30 AM ET slot there is nothing to catch up on and Handigraphs
            # has not posted the slate; after 10 PM ET the day is over and the 6:30 PM
            # slot owns tomorrow's board.
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "${HOUR}:00 ET is outside the catch-up window."
            exit 0
          fi
          # An empty slate writes NO history file — history.py guards its write with
          # `if records:` — so "file missing" also describes every off-season day, the
          # All-Star break, and a full rainout. Without this the catch-up would fire a
          # complete run every hour, all winter. has_games() answers from a date window
          # outside the season without touching the network, and fails open in-season.
          if [ "$(python3 -c 'import season; print(season.game_count(season.today_et()))')" = "0" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no qualifying MLB games on ${DATE} — nothing to publish."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "CATCH-UP: no history/${DATE}.json at ${HOUR}:00 ET — a slot was dropped." 

  build-and-deploy:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set cache date
        run: |
          # season.today_et() is the one Eastern clock the whole project shares; a fixed
          # -4 offset here would disagree with the code by an hour once EST starts.
          python3 -c "import season; print('CACHE_DATE='+season.today_et().strftime('%Y-%m-%d'))" >> $GITHUB_ENV
          python3 -c "import season,datetime; print('TOMORROW_DATE='+(season.today_et()+datetime.timedelta(days=1)).strftime('%Y-%m-%d'))" >> $GITHUB_ENV

      # The key MUST be unique per run. actions/cache never overwrites an existing
      # key — it logs "Cache hit occurred on the primary key, not saving cache" — so a
      # date-only key freezes data/ at whatever the first run of the day happened to
      # save. On 2026-08-08 that was a sparse 83 KB snapshot: the 6:30 PM run downloaded
      # tomorrow's Handigraphs files, used them, and then threw them away, and every
      # later run restored the sparse copy instead. Push-triggered runs skip the
      # download steps but still regenerate and deploy every page, so they published a
      # /tomorrow/ built from an empty data dir — 15 game cards with no stats at all.
      # A run-scoped key means every run saves; restore-keys still finds the newest.
      - name: Restore odds cache
        uses: actions/cache@v6
        with:
          path: data/
          key: odds-${{ env.CACHE_DATE }}-${{ github.run_id }}
          restore-keys: |
            odds-${{ env.CACHE_DATE }}-
            odds-

      - name: Clean stale data files
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          # Remove any data files not dated today or tomorrow — prevents prior-day
          # files from accumulating in the cache all season and ensures a clean
          # slate each run, while preserving tomorrow's files (and their odds/props
          # meta timestamps) across same-day reruns so their fetch throttle works.
          find data/ -maxdepth 1 -type f ! -name "*${{ env.CACHE_DATE }}*" ! -name "*${{ env.TOMORROW_DATE }}*" -delete
          echo "Data dir after cleanup: $(ls data/ 2>/dev/null | wc -l) files"

      - name: Refresh starters
        env:
          HANDIGRAPHS_EMAIL: ${{ secrets.HANDIGRAPHS_EMAIL }}
          HANDIGRAPHS_PASSWORD: ${{ secrets.HANDIGRAPHS_PASSWORD }}
        run: python3 download.py --starters-only

      # Runs on EVERY event, including push. A push re-renders and deploys every page,
      # so without fresh Handigraphs data it publishes stat-less cards over good ones —
      # which is exactly how /tomorrow/ ended up as 15 empty cards. Handigraphs is a flat
      # subscription so refreshing it costs nothing; --no-odds keeps the metered Odds API
      # out of push runs entirely, leaving odds to come from the restored cache.
      - name: Download data
        env:
          HANDIGRAPHS_EMAIL: ${{ secrets.HANDIGRAPHS_EMAIL }}
          HANDIGRAPHS_PASSWORD: ${{ secrets.HANDIGRAPHS_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 download.py --no-odds
          else
            python3 download.py
          fi

      - name: Download tomorrow's data
        env:
          HANDIGRAPHS_EMAIL: ${{ secrets.HANDIGRAPHS_EMAIL }}
          HANDIGRAPHS_PASSWORD: ${{ secrets.HANDIGRAPHS_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 download.py --date tomorrow --no-odds
            exit 0
          fi
          # Tomorrow's ODDS are only wanted from about 6 PM ET onward, so the earlier
          # runs fetch Handigraphs data only and leave the metered Odds API alone.
          #
          # This is also the single biggest line on the Odds API bill. Billing is per
          # market x region, and a per-event props call covers 9 markets: fetching
          # tomorrow's props on all four daily runs was 4 x 15 games x 9 = 540 credits
          # a day for a preview page nobody reads before evening. Once a day instead of
          # four takes that to 135 and keeps the daily total near 534 — inside a
          # 20k/month plan with roughly 20% to spare. See "API Budget" in CLAUDE.md;
          # the market count here moves whenever that URL changes.
          ET_HOUR=$(python3 -c "import season, datetime; print(datetime.datetime.now(season.ET).hour)")
          if [ "$ET_HOUR" -lt 17 ]; then
            echo "[tomorrow] ${ET_HOUR}:00 ET — before the 5 PM cutoff, skipping the Odds API"
            python3 download.py --date tomorrow --no-odds
          elif [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
            # The evening scheduled run forces past the 5h throttle so the first real
            # pull of tomorrow's board always lands, rather than being skipped because
            # some earlier fetch happened to record a timestamp.
            python3 download.py --date tomorrow --force-odds
          else
            # Manual runs after 5 PM: throttled, so repeated dispatches don't re-buy
            # the same board at ~140 credits a time.
            python3 download.py --date tomorrow
          fi

      - name: Clear stale suggestions
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: rm -f data/suggestions_*.json data/suggestions_meta_*.json

      - name: Save odds history
        run: python3 history.py --save

      - name: Generate AI suggestions
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 handicap.py --suggestions-only

      - name: Save AI picks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 picks.py --save

      # Steps from here to the deploy run in a deliberate order:
      #   annotate → commit/push → generate HTML → deploy
      # Annotating before the HTML steps means the Results page and the pick check marks
      # ship this run's grades instead of trailing a run behind. Committing before the
      # HTML steps means the pages are rendered from the exact state that was persisted,
      # and a push failure stops the job before anything reaches the public site.
      - name: Annotate results
        run: |
          python3 history.py --annotate --date yesterday
          python3 picks.py   --annotate --date yesterday
          python3 history.py --annotate
          python3 picks.py   --annotate

      - name: Commit history and picks
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Picks are only saved/committed on scheduled or manually dispatched runs.
          IS_SCHEDULED=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_SCHEDULED=true
          fi

          # `git add <dir>/` is fatal if the directory is missing, and rejections/ only
          # exists on days the verification pass actually throws a pick out. The mkdir
          # has to live here rather than run once up front: the retry path's
          # `git clean -f rejections/` deletes the empty directory again before the
          # second add, so staging has to recreate it every time.
          _stage() {
            mkdir -p history picks rejections usage
            if [ "$IS_SCHEDULED" = "true" ]; then
              git add history/ picks/ rejections/ usage/ data/starters_last3g_today_*.json
            else
              git add history/ usage/ data/starters_last3g_today_*.json
            fi
          }

          # Return the tree to a clean state so the retry's `git pull` can merge.
          # `git checkout --` is atomic across pathspecs: one unmatched path aborts the
          # whole restore silently. rejections/ is untracked whenever no pick was
          # rejected, so listing it alongside history/ and picks/ meant nothing at all
          # got restored and the pull then died on "local changes would be overwritten".
          # Restoring each path on its own keeps one miss from poisoning the rest.
          # Everything removed here is regenerated by _save_and_annotate below.
          _restore() {
            git clean -fdq history/ picks/ rejections/ 2>/dev/null || true
            for _p in history/ picks/ usage/ data/; do
              git checkout -- "$_p" 2>/dev/null || true
            done
          }

          _save_and_annotate() {
            python3 history.py --save
            python3 history.py --annotate --date yesterday
            python3 history.py --annotate
            if [ "$IS_SCHEDULED" = "true" ]; then
              python3 picks.py --save
            fi
            python3 picks.py   --annotate --date yesterday
            python3 picks.py   --annotate
          }

          _stage
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "History: odds $CACHE_DATE"
          git push && exit 0

          for _retry in 1 2; do
            git reset HEAD~1
            _restore
            # --ff-only, and the branch we are actually on.
            #
            # Two bugs lived on this line and both fired on 2026-08-30. A bare `git pull`
            # is FATAL on git >= 2.27 when the branches have diverged and no pull.rebase
            # is configured ("Need to specify how to reconcile divergent branches"), which
            # is precisely the situation this retry exists to recover from — so the
            # concurrent-push recovery CLAUDE.md documents had never actually worked. And
            # `origin main` was hardcoded, so a run on any other branch pulled main into
            # it. After the `git reset HEAD~1` above our HEAD is the commit we started
            # from, so upstream can only be ahead: a fast-forward is the correct and only
            # sound reconciliation, and --ff-only fails loudly if that assumption breaks
            # rather than inventing a merge.
            git pull --ff-only origin "${{ github.ref_name }}"
            _save_and_annotate
            _stage
            git diff --staged --quiet && exit 0
            git commit -m "History: odds $CACHE_DATE"
            git push && exit 0
          done
          # Fail the job rather than fall through to the deploy. A published pick has to
          # be immutable, and it is only immutable once it is committed: the next run
          # starts from a fresh checkout, so picks that were deployed but never pushed
          # come back as a *different* set from a new model call. Better to leave the
          # last good page up than to publish picks we cannot reproduce.
          echo "[history] Push failed after retries — not deploying; will retry next run"
          exit 1

      - name: Generate HTML
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p _site
          python3 handicap.py --html > _site/index.html
          echo "Generated $(wc -c < _site/index.html) bytes"
          printf '/*\n  Cache-Control: no-cache, max-age=0, must-revalidate\n' > _site/_headers

      - name: Generate tomorrow HTML
        run: |
          # Defence in depth against publishing a stats-less page. Cloudflare Pages
          # deploys replace the whole site, so regenerating /tomorrow/ from a data dir
          # that lacks tomorrow's Handigraphs files overwrites a good page with an
          # empty one. If the data is not here, keep whatever is already live.
          if ! ls data/starters_last3g_tomorrow_${TOMORROW_DATE}.json >/dev/null 2>&1; then
            echo "::warning::No starters file for $TOMORROW_DATE — preserving the deployed /tomorrow/ page instead of rebuilding it empty"
            mkdir -p _site/tomorrow
            if curl -fsS --max-time 30 https://mlbautocap.com/tomorrow/ -o _site/tomorrow/index.html; then
              echo "Preserved live page ($(wc -c < _site/tomorrow/index.html) bytes)"
              exit 0
            fi
            echo "::warning::Could not fetch the live page either — rebuilding from what we have"
          fi
          # Deliberately no ANTHROPIC_API_KEY here — this is a matchup/odds preview,
          # not the AI-picks page, so we skip triggering a Claude call for it.
          # Runs every deploy (not just the tomorrow-data steps above) because
          # Cloudflare Pages deploys are full-snapshot replacements — if this file
          # were only written on the 6:30 PM run, the other 3 daily deploys would
          # wipe it from the live site.
          mkdir -p _site/tomorrow
          python3 handicap.py --date tomorrow --html > _site/tomorrow/index.html
          echo "Generated $(wc -c < _site/tomorrow/index.html) bytes"

      - name: Generate results HTML
        run: |
          mkdir -p _site/results
          python3 results.py --html > _site/results/index.html
          echo "Generated $(wc -c < _site/results/index.html) bytes"

      - name: Generate budget HTML
        env:
          CLAUDE_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD }}
          # Optional. When set, the page reports Anthropic's own cost_report figure
          # (billing truth, org-wide) instead of the self-metered ledger. This is an
          # Admin key (sk-ant-admin01-...), NOT ANTHROPIC_API_KEY, and the Admin API
          # needs an organization rather than an individual account. Absent or invalid,
          # the page falls back to the ledger without failing the run.
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
        run: |
          # Reads the git-tracked usage/ ledger, plus cost_report if an Admin key is set.
          mkdir -p _site/budget
          python3 budget.py --html > _site/budget/index.html
          echo "Generated $(wc -c < _site/budget/index.html) bytes"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3"
          command: pages deploy _site --project-name=mlb-capper --commit-dirty=true
